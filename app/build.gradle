plugins {
    id 'com.android.application'
    alias(libs.plugins.kotlin.android)
    // id 'com.google.gms.google-services'
    // id 'com.google.firebase.crashlytics'
}

// Release signing values live in key.properties at the repo root.
// That file is git-ignored: never commit passwords or keystores.
// See key.properties.example for the expected keys.
def keystorePropsFile = rootProject.file('key.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.auratechnologies.nowhere'
    compileSdk 36

    signingConfigs {
        release {
            // Only configured when key.properties exists, so debug builds
            // (including the GitHub Actions build) keep working without it.
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId 'com.auratechnologies.nowhere'
        minSdk 24
        targetSdk 36
        versionCode 10
        versionName '5.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [appLabel: 'NOWHERE']
    }

    buildTypes {
        // Test builds install next to the store version instead of
        // replacing it, so existing records on the phone are not touched.
        debug {
            applicationIdSuffix '.test'
            manifestPlaceholders = [appLabel: 'NOWHERE 테스트']
        }
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.android.billingclient:billing-ktx:8.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // Firebase 二쇱꽍 泥섎━
    // implementation platform('com.google.firebase:firebase-bom:32.3.1')
    // implementation 'com.google.firebase:firebase-crashlytics'
    // implementation 'com.google.firebase:firebase-analytics'
}
configurations {
    all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}
