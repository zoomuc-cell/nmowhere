# Codemagic: NOWHERE 아이폰 앱을 빌드해 TestFlight에 올린다.
# 처음 설정 방법은 ios/README.md의 "Codemagic으로 TestFlight 올리기"를 보세요.
workflows:
  ios-testflight:
    name: NOWHERE iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Codemagic 팀/계정 설정 > Integrations > Developer Portal 에 등록한 API 키 이름
      app_store_connect: N8CMWWQ693
    environment:
      # Codemagic 앱 화면 > Environment variables 에 만든 그룹.
      # CERTIFICATE_PRIVATE_KEY(배포 인증서 개인키)를 넣어 두면 인증서·번들 ID·프로파일을 자동으로 만든다.
      groups:
        - nowhere_signing
      vars:
        BUNDLE_ID: com.auratechnologies.nowhere
        XCODE_PROJECT: ios/NOWHERE.xcodeproj
        XCODE_SCHEME: NOWHERE
      xcode: latest
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create signing files
        script: |
          set -e
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "CERTIFICATE_PRIVATE_KEY가 없습니다. Codemagic 앱 화면 > Environment variables 에 그룹 nowhere_signing 으로 넣어 주세요 (ios/README.md 참고)."
            exit 1
          fi
          # 붙여넣기 형식이 달라도 PEM 개인키로 정리한다 (ci/normalize_cert_key.py 참고).
          KEY_FILE="$CM_BUILD_DIR/cert_key"
          python3 ci/normalize_cert_key.py "$KEY_FILE"
          if grep -q "BEGIN OPENSSH PRIVATE KEY" "$KEY_FILE"; then
            echo "OpenSSH 형식 키를 PEM 형식으로 변환합니다."
            ssh-keygen -p -N "" -m PEM -f "$KEY_FILE" >/dev/null
          fi
          if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            # 헤더 없이 본문만 들어온 경우 PKCS#8 로 한 번 더 시도
            sed -i.bak 's/RSA PRIVATE KEY/PRIVATE KEY/' "$KEY_FILE" && rm -f "$KEY_FILE.bak"
            if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
              echo "CERTIFICATE_PRIVATE_KEY 값을 개인키로 읽을 수 없습니다. 일부만 복사되었을 수 있어요. cert_key 파일 내용 전체를 다시 넣어 주세요."
              exit 1
            fi
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:$KEY_FILE" \
            --create
          rm -f "$KEY_FILE"
      - name: Use signing files
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: |
          set -e
          # vars에 APP_STORE_APPLE_ID(앱의 Apple ID 숫자)를 넣으면 TestFlight 마지막 빌드 번호 + 1을 쓴다.
          # 없으면 1000 + Codemagic 빌드 번호. (빈 값 "" 은 Codemagic이 거부하므로 값이 생길 때만 줄을 추가)
          NEXT=$((1000 + BUILD_NUMBER))
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
            case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
            if [ $((LATEST + 1)) -gt "$NEXT" ]; then NEXT=$((LATEST + 1)); fi
          fi
          echo "Build number: $NEXT"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEXT;/" ios/NOWHERE.xcodeproj/project.pbxproj
          grep -m1 CURRENT_PROJECT_VERSION ios/NOWHERE.xcodeproj/project.pbxproj
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
